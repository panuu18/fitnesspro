<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .neon-glow-primary {
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
        }
        .neon-glow-secondary {
            box-shadow: 0 0 12px rgba(0, 238, 252, 0.3);
        }
        .card-surface {
            background-color: #1E1E1E;
            border: 1px solid #2D2D2D;
        }
        
        /* Activity Ring CSS */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background dark:bg-background text-on-surface dark:text-on-surface min-h-screen flex flex-col pb-24 font-body-lg">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-background z-40">
<div class="flex justify-between items-center px-margin-mobile py-sm w-full">
<div class="flex items-center gap-sm">
<img class="w-10 h-10 rounded-full object-cover" data-alt="A futuristic, high-contrast avatar portrait of an athletic male, sharp lighting against a dark cyberpunk background, subtle neon green highlights. 4k resolution." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9Akf920e_HPc_JOUxcAXc2gBTjUpyE2yyMtFZWqMdaxtR-0D7F5Q8KafivluC2vWzl5RGNsdT0ZC1csyezBdT38mW-2O0CDbxJe9CsbUXs08cAGbCoOBX_E9aAABirpc0qyhX0UBsGTXqbzXSwCc93If-5UUbWaKm-zJfwl0dNZ_kLmruhTZ2vyIFIRtlYr7gfOsI6Hg185O1pZ8-iB-cVe23X_sT_6tgzHESSgNWYPOJL2I2PAO7A2W2MrCBj0FL-H9Q1TmvkFwk"/>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-surface">Ready to crush it, Pranav?</h1>
</div>
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary-fixed dark:text-primary-fixed-dim">notifications</span>
</button>
</div>
</header>
<main class="flex-grow px-margin-mobile flex flex-col gap-lg pb-xl pt-sm">
<!-- Hero: Activity Ring -->
<section class="flex flex-col items-center justify-center pt-md">
<div class="relative w-64 h-64 flex items-center justify-center">
<svg class="w-full h-full drop-shadow-[0_0_12px_rgba(57,255,20,0.5)]" viewbox="0 0 120 120">
<circle class="text-surface-variant stroke-current" cx="60" cy="60" fill="transparent" r="54" stroke-width="8"></circle>
<circle class="text-primary-container stroke-current progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="339.292" stroke-dashoffset="67.858" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute flex flex-col items-center text-center">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-extrabold">8,432</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mt-1">Steps Today</span>
</div>
</div>
</section>
<!-- Stats Grid -->
<section class="grid grid-cols-2 gap-sm">
<!-- Card 1: Calories -->
<div class="card-surface rounded-xl p-md flex flex-col gap-sm hover:border-primary-container transition-colors neon-glow-primary">
<div class="flex justify-between items-center">
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-sm" data-icon="local_fire_department">local_fire_department</span>
</div>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface font-bold">1,240</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-1">CALORIES</div>
</div>
</div>
<!-- Card 2: Active Min -->
<div class="card-surface rounded-xl p-md flex flex-col gap-sm hover:border-primary-container transition-colors">
<div class="flex justify-between items-center">
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-sm" data-icon="timer">timer</span>
</div>
</div>
<div>
<div class="font-headline-md text-headline-md text-on-surface font-bold">45m</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-1">ACTIVE MIN</div>
</div>
</div>
<!-- Card 3: Heart Rate -->
<div class="card-surface rounded-xl p-md flex flex-col gap-sm hover:border-secondary-container transition-colors neon-glow-secondary">
<div class="flex justify-between items-center">
<div class="w-8 h-8 rounded-full bg-secondary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-container text-sm" data-icon="favorite">favorite</span>
</div>
<span class="text-secondary-container font-label-caps text-label-caps">BPM</span>
</div>
<div>
<div class="font-headline-md text-headline-md text-secondary-container font-bold">112</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-1">HEART RATE</div>
</div>
</div>
<!-- Card 4: Water -->
<div class="card-surface rounded-xl p-md flex flex-col gap-sm hover:border-secondary-container transition-colors">
<div class="flex justify-between items-center">
<div class="w-8 h-8 rounded-full bg-secondary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-container text-sm" data-icon="water_drop">water_drop</span>
</div>
<span class="text-secondary-container font-label-caps text-label-caps">ML</span>
</div>
<div>
<div class="font-headline-md text-headline-md text-secondary-container font-bold">1,800</div>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-1">WATER INTAKE</div>
</div>
</div>
</section>
<!-- CTA -->
<section class="mt-auto pt-sm flex justify-center">
<button class="bg-primary-container text-on-primary font-headline-md text-headline-md font-bold w-full max-w-sm py-4 rounded-full neon-glow-primary active:scale-95 transition-transform">
                Start Workout
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-surface border-t border-outline-variant shadow-lg hidden md:hidden flex justify-around items-center px-margin-mobile py-xs md:hidden" style="display: flex;">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-xs shadow-[0_0_12px_rgba(57,255,20,0.3)] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined font-display-lg text-display-lg text-primary-container" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:text-primary-fixed transition-colors active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined font-display-lg text-display-lg" data-icon="fitness_center">fitness_center</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:text-primary-fixed transition-colors active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined font-display-lg text-display-lg" data-icon="restaurant">restaurant</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-xs hover:text-primary-fixed transition-colors active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined font-display-lg text-display-lg" data-icon="person">person</span>
</button>
</nav>
<!-- Desktop Nav (Hidden on Mobile, Required by layout rules conceptually though this is a dashboard likely mobile first) -->
<nav class="hidden md:flex fixed top-0 right-0 h-full w-24 bg-surface dark:bg-surface border-l border-outline-variant flex-col items-center py-lg gap-lg">
<!-- Assuming side nav would go here for desktop, omitting detailed implementation to focus on mobile view requested -->
</nav>
</body></html>
